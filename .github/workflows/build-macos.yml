name: '[MacOS] Build APKViewer'
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: ${{ vars.MACOS_VERSION }}
    permissions:
      contents: write

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: 'pip'

      - name: 'Install Python dependencies'
        run: |
          "$pythonLocation/bin/python" -m pip install --upgrade pip
          "$pythonLocation/bin/python" -m pip install -r requirements.txt
          "$pythonLocation/bin/python" -m pip install nuitka zstandard

      - name: 'Cache Nuitka & ccache'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: 'Build executable with Nuitka'
        run: |
          "$pythonLocation/bin/python" -m nuitka \
              --standalone \
              --onefile \
              --output-dir=dist \
              --output-filename=APKViewer-macos.bin \
              --include-package-data=androguard \
              --include-package-data=ttkbootstrap \
              --include-package-data=babel \
              --include-data-dir=assets=assets \
              --enable-plugin=tk-inter \
              --enable-plugin=anti-bloat \
              --nofollow-import-to=frida \
              --static-libpython=no \
              --lto=yes \
              main.py

      - name: 'Copy binary with commit ID'
        run: cp dist/APKViewer-macos.bin dist/APKViewer-macos-${{ github.sha }}.bin

      - name: 'Upload binary as artifact'
        uses: actions/upload-artifact@v4
        with:
          name: APKViewer-macos-binary
          path: dist/APKViewer-macos-${{ github.sha }}.bin
          retention-days: 90

      - name: 'Upload binary to release'
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APKViewer-macos.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
