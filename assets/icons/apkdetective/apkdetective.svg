<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
    <!-- 
        Native 16x16 Pixel Art SVG
        Removed the isolated green pixel on the right shoulder (x=13, y=12) 
        so it doesn't float between the magnifying glass frame and handle.
    -->
    
    <g fill="#3DDC84">
        <!-- Thicker Left Antenna -->
        <rect x="2" y="1" width="2" height="1" />
        <rect x="3" y="2" width="2" height="1" />
        
        <!-- Thicker Right Antenna -->
        <rect x="12" y="1" width="2" height="1" />
        <rect x="11" y="2" width="2" height="1" />
        
        <!-- Head base -->
        <rect x="3" y="7" width="10" height="7" />
        <!-- Head bottom curve illusion -->
        <rect x="4" y="14" width="8" height="1" />
        
        <!-- Left Shoulder (Starts exactly at y=12) -->
        <rect x="2" y="12" width="1" height="3" />
        <rect x="1" y="13" width="1" height="2" />
        <!-- Filled gap at x=3, y=14 for seamless integration -->
        <rect x="3" y="14" width="1" height="1" />

        <!-- Right Shoulder (Top pixel removed for transparency, rest hidden under handle) -->
        <rect x="13" y="13" width="1" height="2" />
        <rect x="14" y="13" width="1" height="2" />
        <!-- Filled gap at x=12, y=14 for seamless integration -->
        <rect x="12" y="14" width="1" height="1" />
    </g>

    <!-- Detective Hat Dome -->
    <g fill="#795548">
        <rect x="6" y="2" width="4" height="1" />
        <rect x="5" y="3" width="6" height="1" />
        <rect x="4" y="4" width="8" height="2" />
    </g>
    
    <!-- Detective Hat Brim -->
    <rect x="2" y="6" width="12" height="1" fill="#4E342E" />

    <!-- Left Eye -->
    <rect x="5" y="9" width="1" height="1" fill="#202124" />

    <!-- Magnifying Glass Glass/Background -->
    <rect x="9" y="8" width="4" height="4" fill="#E1F5FE" />

    <!-- Magnifying Glass Highlight -->
    <rect x="9" y="8" width="1" height="1" fill="#FFFFFF" />

    <!-- Right Eye (Magnified) -->
    <rect x="10" y="9" width="2" height="2" fill="#202124" />

    <!-- Magnifying Glass Outer Frame -->
    <g fill="#202124">
        <rect x="9" y="7" width="4" height="1" />
        <rect x="9" y="12" width="4" height="1" />
        <rect x="8" y="8" width="1" height="4" />
        <rect x="13" y="8" width="1" height="4" />
    </g>

    <!-- Magnifying Glass Wooden Handle -->
    <g fill="#5D4037">
        <rect x="13" y="13" width="2" height="1" />
        <rect x="13" y="14" width="3" height="1" />
        <rect x="14" y="15" width="2" height="1" />
    </g>
</svg>